<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STRATZ Dota Match Diary</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#111827;--field:#1f2937;--fg:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa;--selection:#1d4ed8;--border:#374151;--danger:#ef4444}
    :root.light{color-scheme:light;--bg:#f8fafc;--panel:#fff;--field:#f1f5f9;--fg:#111827;--muted:#4b5563;--accent:#2563eb;--selection:#bfdbfe;--border:#cbd5e1;--danger:#dc2626}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
    button,select,input,textarea{font:inherit}button,select{border:1px solid var(--border);border-radius:7px;background:var(--field);color:var(--fg);padding:.48rem .7rem}button{cursor:pointer}button:hover{border-color:var(--accent)}button.danger{color:#fecaca;border-color:#7f1d1d}
    header{position:sticky;top:0;z-index:10;display:flex;gap:.55rem;align-items:center;padding:.65rem .9rem;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
    header h1{font-size:1.25rem;margin:0 auto 0 0}.layout{display:grid;grid-template-columns:minmax(260px,22vw) 1fr;min-height:calc(100vh - 55px)}
    aside{border-right:1px solid var(--border);padding:.75rem;overflow:auto;max-height:calc(100vh - 55px);position:sticky;top:55px}.sort{display:flex;align-items:center;gap:.5rem;margin-bottom:.65rem}.sort select{flex:1}.sort-direction{min-width:2.5rem;font-size:1.1rem;padding:.38rem .55rem}
    .legend{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.7rem}.chip{border-radius:5px;padding:.18rem .4rem;font-size:.78rem}.weekend{background:#172554;color:#bfdbfe}.uk{background:#422006;color:#fde68a}.eu{background:#3b0764;color:#e9d5ff}.both{background:#4c0519;color:#fecdd3}
    .day{margin:.45rem 0 .2rem;padding:.38rem .45rem;border-radius:5px;font-weight:700}.match{width:100%;text-align:left;margin:.18rem 0;padding:.55rem}.match.unreviewed{background:color-mix(in srgb,var(--danger) 20%,var(--field));border-color:color-mix(in srgb,var(--danger) 65%,var(--border));box-shadow:inset 4px 0 var(--danger)}.match.active{border-color:var(--accent);background:var(--selection)}.hero-icon{width:28px;height:28px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:.4rem;background:var(--field)}.match .hero-icon{width:22px;height:22px}
    main{padding:1rem;min-width:0}.empty{color:var(--muted);padding:2rem;text-align:center}.match-head{display:flex;align-items:start;gap:1rem}.match-head h2{margin:0}.match-head .meta{color:var(--muted)}.spacer{flex:1}
    fieldset,.player{border:1px solid var(--border);border-radius:9px;background:var(--panel);margin:.8rem 0;padding:.8rem}legend{padding:0 .4rem;font-weight:700}
    textarea{width:100%;min-height:85px;resize:vertical;border:1px solid var(--border);border-radius:7px;background:var(--field);color:var(--fg);padding:.65rem}
    .general-grid{display:grid;grid-template-columns:repeat(4,minmax(125px,1fr));gap:.7rem}.general-grid .wide{grid-column:1/-1}.checkline{display:flex;align-items:center;gap:.5rem}
    .ratings{display:grid;grid-template-columns:repeat(5,minmax(125px,1fr));gap:.6rem}.rating{min-width:0}.rating-head{display:flex;justify-content:space-between;gap:.3rem;color:var(--muted);font-size:.83rem}.rating input[type=range]{width:100%;accent-color:var(--accent)}.skip{display:flex;gap:.3rem;align-items:center;font-size:.8rem;color:var(--muted)}
    .tabs{display:flex;gap:.45rem;margin-top:1rem}.tabs button.active{background:var(--selection);border-color:var(--accent)}.player h3{margin:0 0 .5rem}.player-head{display:flex;align-items:center;gap:.5rem}.player-head h3{margin-right:auto}.flags{display:flex;gap:1rem;margin:.55rem 0}
    .profile{display:flex;align-items:center;flex-wrap:wrap;gap:.55rem;margin:.15rem 0 .65rem;color:var(--muted)}.visibility{padding:.16rem .42rem;border:1px solid var(--border);border-radius:999px;font-size:.78rem}.visibility.public{color:#86efac;border-color:#166534}.visibility.private{color:#fca5a5;border-color:#7f1d1d}.role-result{color:var(--fg)}
    .status{position:fixed;right:1rem;bottom:1rem;z-index:20;max-width:min(680px,80vw);padding:.55rem .8rem;border:1px solid var(--border);border-radius:8px;background:var(--panel);box-shadow:0 4px 20px #0006}.status.error{border-color:var(--danger)}
    dialog{border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--fg);padding:1rem;min-width:340px}.dialog-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.6rem 0}.dialog-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
    @media(max-width:1000px){.layout{grid-template-columns:230px 1fr}.ratings{grid-template-columns:repeat(3,minmax(120px,1fr))}.general-grid{grid-template-columns:repeat(2,minmax(120px,1fr))}}
    @media(max-width:700px){header{flex-wrap:wrap}.layout{display:block}aside{position:static;max-height:35vh;border-right:0;border-bottom:1px solid var(--border)}.ratings{grid-template-columns:repeat(2,minmax(120px,1fr))}}
  </style>
</head>
<body>
  <header>
    <h1>Dota Match Diary</h1>
    <button id="undo">Undo</button><button id="redo">Redo</button>
    <button id="refresh">Check for new games</button><button id="extend">Extend window +1h</button>
    <button id="add-match">Add match ID…</button><button id="export">Export for LLM…</button>
  </header>
  <div class="layout">
    <aside>
      <div class="legend"><span class="chip weekend">Weekend</span><span class="chip uk">UK holiday</span><span class="chip eu">EU flags</span></div>
      <div class="sort"><label for="sort">Order</label><select id="sort"><option value="match_time">Match time</option><option value="diary_started">Diary started</option><option value="diary_updated">Diary updated</option></select><button id="sort-direction" class="sort-direction" type="button" aria-label="Sort newest first" title="Sort newest first">↓</button></div>
      <div id="matches"></div>
    </aside>
    <main id="form"><div class="empty">Loading matches…</div></main>
  </div>
  <div id="status" class="status">Starting…</div>
  <dialog id="export-dialog">
    <h2>Export for an LLM</h2>
    <div class="dialog-row"><label>Gameplay data</label><select id="export-gameplay"><option>none</option><option selected>summary</option><option>full</option></select></div>
    <div class="dialog-row"><label>Diary data</label><select id="export-diary"><option>none</option><option>text</option><option selected>full</option></select></div>
    <div class="dialog-row"><label>Matches</label><select id="export-scope"><option selected>all</option><option>selected</option></select></div>
    <div class="dialog-row"><label>Format</label><select id="export-format"><option selected>markdown</option><option>json</option></select></div>
    <div class="dialog-actions"><button id="export-cancel">Cancel</button><button id="export-go">Download export</button></div>
  </dialog>
  <script>
  (()=>{'use strict';
    let state=null, selected=null, team='allies', lastStatus='', saveBusy=false, sortDescending=true, sortInitialised=false;
    const saveLatest=new Map(), saveTimers=new Map(), histories=new Map(), dirtyIds=new Set();
    const $=s=>document.querySelector(s), clone=o=>JSON.parse(JSON.stringify(o));
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const emptyDiary=()=>({general_comments:'',comeback_or_throw:false,fun:{overall:null,early:null,mid:null,late:null},players:{}});
    const emptyPlayer=()=>({comments:'',ratings:{comms:null,behaviour:null,skill:null,teamwork:null,impact:null},doomism:{chat:null,gameplay:null},avoid:false,friended:false,token_farming:false,comms_frequency:null,mute_likelihood:null});
    function playerHasContent(p){return !!p&&(String(p.comments||'').trim()||Object.values(p.ratings||{}).some(v=>v!=null)||Object.values(p.doomism||{}).some(v=>v!=null)||p.avoid||p.friended||p.token_farming||p.comms_frequency!=null||p.mute_likelihood!=null)}
    function diaryHasContent(d){return !!d&&(String(d.general_comments||'').trim()||d.comeback_or_throw||Object.values(d.fun||{}).some(v=>v!=null)||Object.values(d.players||{}).some(playerHasContent))}
    function status(text,error=false){lastStatus=text;const el=$('#status');el.textContent=text;el.classList.toggle('error',error)}
    async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Diary-Request':'1',...(options.headers||{})}});if(!r.ok)throw new Error((await r.text())||`${r.status}`);return r.headers.get('content-type')?.includes('json')?r.json():r.text()}
    function game(id=selected){return state?.games.find(g=>String(g.match_id)===String(id))}
    function diary(){const g=game();if(!g)return null;g.diary ||= emptyDiary();return g.diary}
    function playerDiary(key){const d=diary();d.players[key] ||= emptyPlayer();return d.players[key]}
    function history(id=selected){if(!histories.has(id))histories.set(id,{undo:[],redo:[],last:0});return histories.get(id)}
    function beforeEdit(){const h=history(),now=Date.now();if(now-h.last>500){h.undo.push(clone(diary()));h.undo=h.undo.slice(-100);h.redo=[]}h.last=now}
    function scheduleSave(id=selected){dirtyIds.add(String(id));clearTimeout(saveTimers.get(id));saveTimers.set(id,setTimeout(()=>{saveTimers.delete(id);saveLatest.set(id,clone(game(id).diary));pumpSaves()},280));status('Editing…')}
    async function pumpSaves(){if(saveBusy)return;saveBusy=true;while(saveLatest.size){const entries=[...saveLatest.entries()];saveLatest.clear();for(const [id,snapshot] of entries){try{await api(`api/diary/${encodeURIComponent(id)}`,{method:'POST',body:JSON.stringify(snapshot)});if(!saveLatest.has(id)&&!saveTimers.has(id))dirtyIds.delete(String(id));status('Autosaved in background')}catch(e){saveLatest.set(id,snapshot);status(`Autosave retrying: ${e.message}`,true);await new Promise(r=>setTimeout(r,750));break}}}saveBusy=false}
    function setDeep(root,path,value){const bits=path.split('.');let at=root;for(let i=0;i<bits.length-1;i++)at=at[bits[i]];at[bits.at(-1)]=value}
    function getDeep(root,path){return path.split('.').reduce((a,k)=>a?.[k],root)}
    function rating(path,label,value,labels={}){const v=value??3,shown=value==null?'Skip':(labels[value]||value);return `<div class="rating" data-rating="${esc(path)}"><div class="rating-head"><span>${esc(label)}</span><b class="value-readout">${esc(shown)}</b></div><input type="range" min="1" max="5" step="1" value="${v}" data-path="${esc(path)}"><label class="skip"><input type="checkbox" data-skip="${esc(path)}" ${value==null?'checked':''}> Skip</label></div>`}
    function heroIcon(heroId){const id=Number(heroId);return Number.isInteger(id)&&id>0?`<img class="hero-icon" src="hero-icons/${id}.png" alt="" loading="lazy">`:''}
    function matchSort(a,b){const key={diary_started:'created_at_utc',diary_updated:'updated_at_utc',match_time:'start_time_utc'}[$('#sort').value]||'start_time_utc',left=String(a[key]||''),right=String(b[key]||'');if(!left&&right)return 1;if(left&&!right)return -1;return left.localeCompare(right)*(sortDescending?-1:1)}
    function updateSortDirection(){const button=$('#sort-direction'),description=sortDescending?'newest first':'oldest first';button.textContent=sortDescending?'↓':'↑';button.title=`Sort ${description}`;button.setAttribute('aria-label',button.title)}
    function initialiseSort(){if(sortInitialised||!state)return;const configured=state.default_sort_by;$('#sort').value=['match_time','diary_started','diary_updated'].includes(configured)?configured:'match_time';sortDescending=state.default_sort_descending!==false;sortInitialised=true;updateSortDirection()}
    function funMarker(g){if(!diaryHasContent(g.diary))return '';return ({1:'😫',2:'🙁',3:'😐',4:'🙂',5:'😄'})[g.diary?.fun?.overall]||'⏭️'}
    function renderList(){const box=$('#matches');box.innerHTML='';let day='';for(const g of [...state.games].sort(matchSort)){if(g.local_date!==day){day=g.local_date;const d=document.createElement('div');d.className=`day ${g.day_class||''}`;d.title=g.day_details||'';d.textContent=`${g.local_day_label} ${g.holiday_flags||''}`;box.append(d)}const b=document.createElement('button'),hasDiary=diaryHasContent(g.diary);b.className=`match${hasDiary?'':' unreviewed'}${String(g.match_id)===String(selected)?' active':''}`;if(!hasDiary)b.title='No diary entry yet';const marker=funMarker(g);b.innerHTML=`<b>${marker?esc(marker)+' ':''}${esc(g.local_time)} · ${esc(String(g.result||'?').toUpperCase())}</b><br>${heroIcon(g.self_hero_id)}${esc(g.self_hero_name||'Unknown hero')} · ${esc(g.match_id)}`;b.onclick=()=>selectMatch(String(g.match_id));box.append(b)}}
    function renderForm(){const g=game();if(!g){$('#form').innerHTML='<div class="empty">No ranked games are currently available.</div>';return}const d=diary(),outcome=g.result==='win'?'Felt like a comeback':g.result==='loss'?'Felt like a throw':'Unusual comeback or throw';const players=(g.players||[]).filter(p=>team==='allies'?(p.is_ally||p.is_self):(!p.is_ally&&!p.is_self));
      $('#form').innerHTML=`<div class="match-head"><div><h2>Match ${esc(g.match_id)}</h2><div class="meta">${esc(g.local_datetime)} · ${esc(String(g.result||'unknown').toUpperCase())} · ${esc(g.game_mode||g.lobby_type||'mode unknown')}</div></div><div class="spacer"></div><a href="${esc(g.stratz_url)}" target="_blank"><button>Open STRATZ</button></a><button class="danger" id="clear-game">Clear whole game</button></div>
      <fieldset><legend>Match diary</legend><div class="general-grid"><label class="checkline wide"><input type="checkbox" data-bool="comeback_or_throw" ${d.comeback_or_throw?'checked':''}> ${esc(outcome)}</label>${['overall','early','mid','late'].map(p=>rating(`fun.${p}`,`${p[0].toUpperCase()+p.slice(1)} fun`,d.fun[p],{1:'Awful',3:'Neutral',5:'Excellent'})).join('')}<label class="wide">Miscellaneous comments about this game<textarea data-text="general_comments">${esc(d.general_comments)}</textarea></label></div></fieldset>
      <div class="tabs"><button data-team="allies" class="${team==='allies'?'active':''}">Allies</button><button data-team="enemies" class="${team==='enemies'?'active':''}">Enemies</button></div><div id="players">${players.map(playerCard).join('')}</div><p class="meta">Every edit autosaves in the background. There is intentionally no Save or Submit button.</p>`;
      bindForm();
    }
    function playerCard(p){const key=String(p.key),v=playerDiary(key),title=`${p.name||'Anonymous'} — ${p.hero_name||'Unknown hero'}${p.is_self?' (you)':''}${p.position?' · P'+p.position:''}`;const base=['comms','behaviour','skill','teamwork','impact'].map(m=>rating(`players.${key}.ratings.${m}`,m[0].toUpperCase()+m.slice(1),v.ratings[m])).join('');const mute={1:'Not muted',2:'Unlikely',3:'Suspected',4:'Likely',5:'Probably muted'};const isPublic=p.profile_public===true,visibility=isPublic?'Public':p.profile_public===false?'Private':'Visibility unknown';let role='';if(isPublic){if(p.role_check_status==='checking')role='<span class="role-result">Checking last 50 ranked games with role data…</span>';else if(p.main_role!=null)role=`<span class="role-result">Main role P${esc(p.main_role)} — ${esc(p.main_role_percent)}% of ${esc(p.role_sample_size)} · Token farming: <b>${p.token_farming_detected?'Yes':'No'}</b></span><button data-check-role="${esc(key)}">Check again</button>`;else role=`<button data-check-role="${esc(key)}">Check main role</button>${p.role_check_error?`<span>${esc(p.role_check_error)}</span>`:''}`}else role=`<label><input type="checkbox" data-player-bool="${esc(key)}.token_farming" ${v.token_farming?'checked':''}> Token farming?</label>`;return `<section class="player"><div class="player-head">${heroIcon(p.hero_id)}<h3>${esc(title)}</h3><button data-clear-player="${esc(key)}">Clear player</button></div><div class="profile"><span class="visibility ${isPublic?'public':'private'}">STRATZ profile: ${esc(visibility)}</span>${role}</div><div class="ratings">${base}${rating(`players.${key}.doomism.chat`,'Doomism — chat',v.doomism.chat)}${rating(`players.${key}.doomism.gameplay`,'Doomism — gameplay',v.doomism.gameplay)}${rating(`players.${key}.comms_frequency`,'Comms frequency',v.comms_frequency,{1:'Silent',2:'Rare',3:'Sometimes',4:'Frequent',5:'Constant'})}${rating(`players.${key}.mute_likelihood`,'Muted?',v.mute_likelihood,mute)}</div><div class="flags"><label><input type="checkbox" data-player-bool="${esc(key)}.avoid" ${v.avoid?'checked':''}> Avoid</label><label><input type="checkbox" data-player-bool="${esc(key)}.friended" ${v.friended?'checked':''}> Friended</label></div><label>Miscellaneous comments<textarea data-player-text="${esc(key)}">${esc(v.comments)}</textarea></label></section>`}
    function changed(path,value,element){beforeEdit();setDeep(diary(),path,value);if(element){const wrap=element.closest('.rating'),read=wrap.querySelector('.value-readout'),skip=wrap.querySelector('[data-skip]');skip.checked=value==null;const labels=path.endsWith('comms_frequency')?{1:'Silent',2:'Rare',3:'Sometimes',4:'Frequent',5:'Constant'}:path.endsWith('mute_likelihood')?{1:'Not muted',2:'Unlikely',3:'Suspected',4:'Likely',5:'Probably muted'}:path.startsWith('fun.')?{1:'Awful',3:'Neutral',5:'Excellent'}:{};read.textContent=value==null?'Skip':(labels[value]||value)}renderList();scheduleSave()}
    function bindForm(){document.querySelectorAll('[data-path]').forEach(el=>{el.addEventListener('pointerdown',()=>changed(el.dataset.path,Number(el.value),el));el.addEventListener('input',()=>changed(el.dataset.path,Number(el.value),el))});document.querySelectorAll('[data-skip]').forEach(el=>el.onchange=()=>changed(el.dataset.skip,el.checked?null:Number(el.closest('.rating').querySelector('[data-path]').value),el));document.querySelectorAll('[data-bool]').forEach(el=>el.onchange=()=>changed(el.dataset.bool,el.checked));document.querySelectorAll('[data-text]').forEach(el=>el.oninput=()=>changed(el.dataset.text,el.value));document.querySelectorAll('[data-player-bool]').forEach(el=>el.onchange=()=>{const [key,field]=el.dataset.playerBool.split('.');changed(`players.${key}.${field}`,el.checked)});document.querySelectorAll('[data-player-text]').forEach(el=>el.oninput=()=>changed(`players.${el.dataset.playerText}.comments`,el.value));document.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>{team=el.dataset.team;renderForm()});document.querySelectorAll('[data-check-role]').forEach(el=>el.onclick=()=>checkRole(el.dataset.checkRole));document.querySelectorAll('[data-clear-player]').forEach(el=>el.onclick=()=>{beforeEdit();diary().players[el.dataset.clearPlayer]=emptyPlayer();renderList();scheduleSave();renderForm()});$('#clear-game').onclick=()=>{if(confirm('Clear every diary field for this game? You can undo this action.')){beforeEdit();game().diary=emptyDiary();renderList();scheduleSave();renderForm()}}}
    function selectMatch(id){selected=id;team='allies';renderList();renderForm()}
    function undo(){const h=history();if(!h.undo.length)return status('Nothing to undo.');h.redo.push(clone(diary()));game().diary=h.undo.pop();h.last=0;scheduleSave();renderForm()}
    function redo(){const h=history();if(!h.redo.length)return status('Nothing to redo.');h.undo.push(clone(diary()));game().diary=h.redo.pop();h.last=0;scheduleSave();renderForm()}
    function mergeDirty(fresh){if(!state)return fresh;for(const id of dirtyIds){const local=game(id),remote=fresh.games.find(g=>String(g.match_id)===String(id));if(local&&remote)remote.diary=local.diary}return fresh}
    async function pollUntilIdle(){try{const fresh=mergeDirty(await api('api/state'));status(fresh.status+(fresh.writer_error?` · Save error: ${fresh.writer_error}`:''),!!fresh.writer_error);if(fresh.query_in_progress){setTimeout(pollUntilIdle,1200);return}state=fresh;const old=selected;selected=state.games.some(g=>String(g.match_id)===String(old))?old:(state.games[0]?String(state.games[0].match_id):null);renderList();renderForm()}catch(e){status(`Could not refresh diary: ${e.message}`,true);setTimeout(pollUntilIdle,1800)}}
    async function load(){try{state=mergeDirty(await api('api/state'));document.documentElement.classList.toggle('light',!state.dark_mode);initialiseSort();const old=selected;selected=state.games.some(g=>String(g.match_id)===String(old))?old:(state.games[0]?String(state.games[0].match_id):null);renderList();renderForm();status(state.status+(state.writer_error?` · Save error: ${state.writer_error}`:''),!!state.writer_error);if(state.query_in_progress)setTimeout(pollUntilIdle,1200)}catch(e){status(`Could not load diary: ${e.message}`,true);setTimeout(load,1800)}}
    async function action(path,body={}){try{const r=await api(path,{method:'POST',body:JSON.stringify(body)});status(r.status||'Started');setTimeout(load,350)}catch(e){status(e.message,true)}}
    async function checkRole(playerKey){try{const result=await api('api/check-role',{method:'POST',body:JSON.stringify({match_id:Number(selected),player_key:playerKey})});const p=game().players.find(row=>String(row.key)===String(playerKey));if(p)p.role_check_status='checking';status(result.status);renderForm();setTimeout(pollRole,700)}catch(e){status(e.message,true)}}
    async function pollRole(){try{const fresh=mergeDirty(await api('api/state'));const checking=fresh.games.some(g=>(g.players||[]).some(p=>p.role_check_status==='checking'));status(checking?'Role check is still running…':fresh.status);if(checking){setTimeout(pollRole,800);return}state=fresh;renderList();renderForm()}catch(e){status(`Role check update failed: ${e.message}`,true);setTimeout(pollRole,1200)}}
    $('#sort').onchange=renderList;$('#sort-direction').onclick=()=>{sortDescending=!sortDescending;updateSortDirection();renderList()};$('#undo').onclick=undo;$('#redo').onclick=redo;$('#refresh').onclick=()=>action('api/refresh');$('#extend').onclick=()=>action('api/extend');$('#add-match').onclick=()=>{const id=prompt('Enter the STRATZ/Dota match ID:');if(id&&/^\d+$/.test(id))action('api/add-match',{match_id:Number(id)})};
    $('#export').onclick=()=>$('#export-dialog').showModal();$('#export-cancel').onclick=()=>$('#export-dialog').close();$('#export-go').onclick=()=>{const q=new URLSearchParams({gameplay:$('#export-gameplay').value,diary:$('#export-diary').value,scope:$('#export-scope').value,format:$('#export-format').value,id:selected||'',sort_by:$('#sort').value,descending:String(sortDescending)});window.location=`api/export?${q}`;$('#export-dialog').close()};
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
    load();
  })();
  </script>
</body>
</html>
